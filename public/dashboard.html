<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard para LampID y UsuarioID</title>
    <link rel="stylesheet" href="../estilos/estilos.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="../driver/animaciones.js" defer></script>
    <script type="module" src="../driver/verificarConexion.js" defer></script>
    <script type="module" src="../driver/cargarDatos.js" defer></script>
    <script type="module" src="../driver/grafico.js" defer></script>
    <script type="module" src="../driver/util.js" defer></script>
    <script type="module" src="../driver/main.js" defer></script>
  </head>
  <body>
    <div class="contenedor-formulario">
      <form id="formulario_lamp_id">
        <input
          type="text"
          id="lampIDInput"
          placeholder="Ingrese LampID"
          value="lamp1"
        />
        <input
          type="text"
          id="userIDInput"
          placeholder="Ingrese UsuarioID"
          value="1"
        />
        <button type="submit" id="cargarDatosBtn">Cargar Datos</button>
      </form>
    </div>
    <div class="contenedor-graficos">
      <div class="columna">
        <div class="grafico">
          <canvas id="lampOnOffChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="tempValueChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="tempIntChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="sepPointChart"></canvas>
        </div>
      </div>
      <div class="columna">
        <div class="grafico">
          <canvas id="histogramaUsuarioChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="relacionFechaUsuarioChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="histogramaUsuarioLampChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="consumoTotalChart"></canvas>
        </div>
        <div class="grafico">
          <canvas id="vidaUtilChart"></canvas>
        </div>
      </div>
    </div>
    <div style="position: fixed; right: 50%; bottom: 0; margin: 10px">
      <button id="button_cambiar_estado" class="btn btn-primary">
        Cambiar Estado de la Lámpara
      </button>
    </div>
    <div style="position: fixed; left: 0; bottom: 0; margin: 10px">
      <button id="button_estado_foco" class="btn btn-secondary">
        Estado del Foco
      </button>
    </div>
  </body>
</html>
